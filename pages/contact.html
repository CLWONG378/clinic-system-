<!DOCTYPE html>
<html lang="zh-hk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>聯絡我們 - 樂活醫療 lohas medical</title>

    <!-- Absolute static path for CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body>

    <header>
        <img src="/assets/images/logo.png" alt="樂活醫療 lohas medical logo">

        <h1 data-key="clinic_name">
            樂活醫療 lohas medical
        </h1>

        <p data-key="tagline">
            以愛為本 用心服務
        </p>

        <div class="language-switch">
            <button type="button" onclick="changeLanguage('en')">English</button>
            <button type="button" onclick="changeLanguage('zh-cn')">简体</button>
            <button type="button" onclick="changeLanguage('zh-hk')">繁體</button>
        </div>
    </header>

    <nav>
        <a href="/index.html" data-key="home">Home</a>
        <a href="/pages/about.html" data-key="about">About</a>
        <a href="/pages/services.html" data-key="services">Services</a>
        <a href="/pages/contact.html" data-key="contact">Contact</a>
        <a href="/pages/booking.html" data-key="booking">Book Appointment</a>
    </nav>

    <main>
        <section>
            <h2 data-key="contact_title">聯絡我們</h2>

            <div class="contact-info">
                <p><strong><span data-key="address_label">診所地址：</span></strong> <span data-key="address_text">香港九龍</span></p>
                <p><strong><span data-key="phone_label">電話號碼：</span></strong> <span data-key="phone_text">+852 1234 5678</span></p>
                <p><strong><span data-key="email_label">電郵地址：</span></strong> <span data-key="email_text">info@lohasmedical.com</span></p>
            </div>
        </section>

        <section>
            <h2 data-key="hours_title">服務時間</h2>
            <p data-key="weekday_hours">星期一至五：09:00 - 19:00</p>
            <p data-key="saturday_hours">星期六：09:00 - 17:00</p>
            <p data-key="sunday_hours">星期日及公眾假期：休息</p>
        </section>

        <section class="booking-section">
            <h2 data-key="inquiry_title">查詢表格</h2>
            <form id="contact-form">
                <label for="contact-name" data-key="name">姓名</label>
                <input id="contact-name" type="text" placeholder="請輸入姓名" required>

                <label for="contact-phone" data-key="phone">電話</label>
                <input id="contact-phone" type="tel" placeholder="請輸入電話號碼" required>

                <label for="contact-message" data-key="message">留言內容</label>
                <textarea id="contact-message" rows="4" placeholder="請輸入您的查詢內容..." required></textarea>

                <button type="submit" data-key="submit_inquiry">送出查詢</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 樂活醫療 lohas medical. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="/assets/js/language.js"></script>
    <script src="/assets/js/script.js"></script>

</body>

</html>
