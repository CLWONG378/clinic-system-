<!DOCTYPE html>
<html lang="zh-hk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>預約診症 - 樂活醫療 lohas medical</title>

    <!-- Absolute static path for CSS -->
    <link rel="stylesheet" href="/assets/css/style.css">
    <!-- Flatpickr Calendar CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
</head>

<body>

    <header>
        <img src="/assets/images/logo.png" alt="樂活醫療 lohas medical logo">

        <h1 data-key="clinic_name">
            樂活醫療 lohas medical
        </h1>

        <p data-key="tagline">
            以愛為本 用心服務
        </p>

        <div class="language-switch">
            <button type="button" onclick="changeLanguage('en')">English</button>
            <button type="button" onclick="changeLanguage('zh-cn')">简体</button>
            <button type="button" onclick="changeLanguage('zh-hk')">繁體</button>
        </div>
    </header>

    <nav>
        <a href="/index.html" data-key="home">Home</a>
        <a href="/pages/about.html" data-key="about">About</a>
        <a href="/pages/services.html" data-key="services">Services</a>
        <a href="/pages/contact.html" data-key="contact">Contact</a>
        <a href="/pages/booking.html" data-key="booking">Book Appointment</a>
    </nav>

    <main>
        <section class="booking-section">
            <h2 data-key="booking_title">預約診症</h2>

            <form id="booking-form">
                <!-- 1. Choose Service -->
                <h3 data-key="choose_service">選擇服務</h3>
                <select id="service" required>
                    <option value="" disabled selected data-key="select_service_placeholder">請選擇服務</option>
                    <option value="pain_rehabilitation" data-key="pain_rehabilitation">疼痛康復</option>
                    <option value="spinal_correction" data-key="spinal_correction">脊柱矯正</option>
                    <option value="postpartum_recovery" data-key="postpartum_recovery">產後康復</option>
                    <option value="posture_adjustment" data-key="posture_adjustment">體態調整</option>
                    <option value="foot_treatment" data-key="foot_treatment">足科治療</option>
                    <option value="chinese_orthopedics" data-key="chinese_orthopedics">中醫骨科</option>
                </select>

                <!-- 2. Choose Doctor by Side-by-Side Image Buttons -->
                <h3 data-key="choose_doctor">選擇醫生</h3>
                <input type="hidden" id="selected-doctor" name="doctor" required>

                <div class="doctor-grid">
                    <button type="button" class="doctor-card-btn" data-doctor-id="wong_yat_tak" onclick="selectDoctor('wong_yat_tak', this)">
                        <img src="/assets/images/WongYatTak.png" alt="王溢德 醫師" class="doctor-photo">
                        <div class="doctor-info">
                            <h4 class="doctor-name" data-key="doctor_tak_name">王溢德 醫師</h4>
                            <p class="doctor-title" data-key="doctor_tak_title">Wong Yat Tak</p>
                        </div>
                    </button>

                    <button type="button" class="doctor-card-btn" data-doctor-id="wong_yat_ki" onclick="selectDoctor('wong_yat_ki', this)">
                        <img src="/assets/images/WongYatKi.png" alt="王溢琪 醫師" class="doctor-photo">
                        <div class="doctor-info">
                            <h4 class="doctor-name" data-key="doctor_ki_name">王溢琪 醫師</h4>
                            <p class="doctor-title" data-key="doctor_ki_title">Wong Yat Ki</p>
                        </div>
                    </button>
                </div>

                <!-- 3. Choose Date & Time Buttons (30-min intervals) -->
                <h3 data-key="choose_datetime">選擇預約時間</h3>

                <label for="appointment-date" data-key="appointment_date">預約日期</label>
                <div class="date-input-wrapper">
                    <input id="appointment-date" type="text" inputmode="numeric" placeholder="YYYY-MM-DD (點擊選擇或直接輸入)" required>
                </div>

                <label data-key="appointment_time_label">選擇時段 (30分鐘一節)</label>
                <input type="hidden" id="appointment-time" name="appointment_time" required>

                <div id="time-slots-container" class="time-slots-grid">
                    <!-- JavaScript populates 30-min buttons here -->
                </div>

                <!-- 4. Patient Information -->
                <h3 data-key="patient_information">客戶資料</h3>

                <label for="name" data-key="name">姓名</label>
                <input id="name" type="text" placeholder="請輸入姓名" required>

                <label for="phone" data-key="phone">電話</label>
                <input id="phone" type="tel" placeholder="請輸入電話號碼" required>

                <label for="email" data-key="email">電郵</label>
                <input id="email" type="email" placeholder="example@email.com">

                <button type="submit" data-key="submit_booking">提交預約</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 樂活醫療 lohas medical. All rights reserved.</p>
    </footer>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="/assets/js/language.js"></script>
    <script src="/assets/js/script.js"></script>
    <script src="/assets/js/booking.js"></script>

    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const dateInput = document.getElementById("appointment-date");

            flatpickr(dateInput, {
                dateFormat: "Y-m-d",     // Standard format (e.g., 2026-11-20)
                allowInput: true,        // Lets users type numbers directly
                minDate: "today",        // Prevents booking past dates
                disable: [
                    function(date) {
                        // Optional: disable Sundays (0) since clinic is closed
                        return (date.getDay() === 0);
                    }
                ],
                onChange: function(selectedDates, dateStr, instance) {
                    // Ensures booking.js detects the change to load time slots
                    dateInput.dispatchEvent(new Event("change"));
                }
            });
        });
    </script>

</body>

</html>
